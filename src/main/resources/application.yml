spring:
  application:
    name: darmoz-whatsapp
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexora}
    username: ${DB_USER:nexora}
    password: ${DB_PASSWORD:}
    hikari:
      # El Postgres compartido tiene max_connections=100.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    table: wa_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    placeholder-replacement: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: ${DARMOZ_WHATSAPP_PATH_PREFIX:/darmoz-whatsapp}

# Tokens del dashboard: Application de sistema de darmoz-auth + rol SUPER.
darmoz-auth:
  # Llave publica RSA de darmoz-auth (en el server se monta de
  # /opt/infra/services/darmoz-auth/keys/public_key.pem).
  public-key-path: ${DARMOZ_AUTH_PUBLIC_KEY_PATH:}
  issuer: ${DARMOZ_AUTH_ISSUER:darmoz-auth}
  application-id: ${DARMOZ_AUTH_APPLICATION_ID:11111111-1111-1111-1111-111111111111}
  admin-role: ${ADMIN_ROLE:SUPER}

darmoz:
  whatsapp:
    # AES-256 en base64 (32 bytes) para cifrar tokens y secretos guardados en la base.
    secrets-key: ${WA_SECRETS_KEY:}
    # Base publica con la que Meta llega al webhook (sin el context path).
    public-base-url: ${WA_PUBLIC_BASE_URL:https://darmozsc.duckdns.org}
    graph-api-base-url: ${WA_GRAPH_API_BASE_URL:https://graph.facebook.com}
    default-graph-api-version: ${WA_GRAPH_API_VERSION:v21.0}
    engine:
      max-steps-per-message: ${WA_ENGINE_MAX_STEPS:50}
      http-max-response-bytes: ${WA_HTTP_MAX_RESPONSE_BYTES:262144}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
